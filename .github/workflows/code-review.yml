name: Code Review
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          cd .github/actions/code-review
          npm install

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590183999298:role/github-oidc-role
          aws-region: us-east-1

      - name: Code Review with AI
        uses: ./.github/actions/code-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-region: us-east-1
          bedrock-model-id: anthropic.claude-3-sonnet-20240229-v1:0
          exclude-patterns: |
            node_modules/**
            .github/**
            .gitignore
            .github/actions/code-review/**
            package.json
            package-lock.json
            README.md
            dist/**
            build/**
            *.min.jsa
            *.lock
          max-files: "15"
          comment-threshold: "BAJA"
      - name: Debug Action Structure
        run: |
            ls -la .github/actions/code-review
            echo "Main file exists: $(test -f .github/actions/code-review/dist/index.js && echo 'Yes' || echo 'No')"
        
      - name: Verify Node Modules
        working-directory: .github/actions/code-review
        run: npm list --depth=0